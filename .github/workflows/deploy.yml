name: Guardian Nexus

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: guardian-nexus-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pnpm install --frozen-lockfile
      - name: Refresh Bungie manifest for production
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: pnpm manifest:sync
      - run: pnpm run audit
      - name: Apply additive D1 migrations
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: pnpm --filter @guardian-nexus/api exec wrangler d1 migrations apply guardian-nexus-v1 --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy Guardian Nexus API
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: pnpm --filter @guardian-nexus/api run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy Guardian Nexus web
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: pnpm --filter @guardian-nexus/web run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
