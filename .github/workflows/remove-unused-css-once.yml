name: Remove verified unused CSS once

on:
  push:
    branches:
      - refactor/css-typescript-cleanup

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/css-typescript-cleanup
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node tools/remove-unused-css-once.mjs
      - run: pnpm run audit
      - run: pnpm lint
      - name: Commit validated CSS removal
        run: |
          rm tools/remove-unused-css-once.mjs
          rm .github/workflows/remove-unused-css-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Remove verified unused frontend styles"
          git push origin HEAD:refactor/css-typescript-cleanup
